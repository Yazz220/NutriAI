<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
    <title id="title">Nosh Android adaptive icon background</title>
    <defs>
        <filter id="paper" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="29" result="noise"/>
            <feColorMatrix in="noise" type="matrix" values="0.18 0 0 0 0.62  0 0.16 0 0 0.56  0 0 0.14 0 0.46  0 0 0 0.055 0" result="paperNoise"/>
            <feBlend in="SourceGraphic" in2="paperNoise" mode="multiply"/>
        </filter>
    </defs>
    <rect width="1024" height="1024" fill="#F7F2EA" filter="url(#paper)"/>
</svg>
