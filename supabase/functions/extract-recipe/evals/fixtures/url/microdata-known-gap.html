    <article itemscope itemtype="https://schema.org/Recipe">
      <h1 itemprop="name">Apple Crumble</h1>
      <p itemprop="recipeYield">Serves 6</p>
      <ul>
        <li itemprop="recipeIngredient">4 apples, sliced</li>
        <li itemprop="recipeIngredient">120 g flour</li>
        <li itemprop="recipeIngredient">80 g butter</li>
      </ul>
      <p itemprop="recipeInstructions">Top the apples with the crumble and bake at 190°C for 35 minutes.</p>
