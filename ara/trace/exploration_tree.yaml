tree:
  - id: N01
    type: decision
    title: "Consolidate recipe capture into Save a Recipe"
    provenance: user
    timestamp: "2026-08-23T04:08+03:00"
    choice: >-
      Remove the approval-era attention entry point and show processing, failure,
      destination, and ready states inside one Save a Recipe experience.
    alternatives:
      - "Keep a separate recipes-need-you queue"
      - "Auto-open a different screen after processing"
    evidence:
      - "User direction: imported recipes now proceed directly to books without approval or review"
      - "Pre-change browser reproduction showed a separate recipes-need-you shelf action"
    status: resolved
    children:
      - id: N02
        type: experiment
        title: "Verify unified capture states and mobile flow"
        provenance: ai-executed
        timestamp: "2026-08-23T04:08+03:00"
        result: >-
          Phone-sized browser verification showed one Save a Recipe entry point,
          inline recipe activity, destination selection, and compatibility redirect.
          TypeScript, targeted lint, five Jest suites, 25 tests, and diff checks passed.
        evidence:
          - "app/(book)/save.tsx"
          - "components/nosh/capture/NoshCaptureWorkspace.tsx"
          - "__tests__/components/NoshCaptureWorkspace.test.tsx"
          - "__tests__/utils/cookbook/capturePresentation.test.ts"
        status: resolved
  - id: N03
    type: experiment
    title: "Reproduce duplicate recipe group keys"
    provenance: ai-executed
    timestamp: "2026-08-23T04:35+03:00"
    result: >-
      A two-group recipe fixture using the model fallback id `default` failed at both
      boundaries: normalization preserved one unique id for two groups, and TextLayer
      emitted two duplicate-key warnings matching the iPhone screenshot.
    evidence:
      - "__tests__/utils/cookbook/recipeGraphNormalization.test.ts"
      - "__tests__/components/cookbook/TextLayer.test.tsx"
      - "User screenshot dated 2026-08-23 04:23"
    status: resolved
    children:
      - id: N04
        type: decision
        title: "Repair IDs at extraction and tolerate legacy collisions"
        provenance: ai-suggested
        timestamp: "2026-08-23T04:35+03:00"
        choice: >-
          Generate deterministic unique group and step ids in the shared extraction
          normalizer, and use collision-safe React keys when rendering persisted graphs.
        alternatives:
          - "Change only the renderer and keep persisting invalid IDs"
          - "Change only extraction and leave existing saved recipes broken"
          - "Rewrite existing recipe rows in the database"
        evidence:
          - N03
          - O01
        status: resolved
      - id: N05
        type: experiment
        title: "Verify and deploy duplicate-ID repair"
        provenance: ai-executed
        timestamp: "2026-08-23T04:35+03:00"
        result: >-
          The focused reproduction and broader typesetter suite passed 8 tests,
          TypeScript and lint checks passed, iOS rebuilt without the duplicate-key error,
          and extract-recipe deployed as active Supabase function version 7.
        evidence:
          - "components/cookbook/typesetter/TextLayer.tsx"
          - "supabase/functions/_shared/recipeGraphNormalization.ts"
          - "Supabase extract-recipe version 7: ACTIVE"
        status: resolved
  - id: N06
    type: experiment
    title: "Trace repeated page-generation credit failures"
    provenance: ai-executed
    timestamp: "2026-08-23T05:01+03:00"
    result: >-
      Image and URL captures both completed extraction and page creation, then failed before
      the OpenRouter image call because the Nosh credit ledger balance was zero. The configured
      OpenRouter key remained valid with approximately $4.48 of provider credit available.
    evidence:
      - "Recent nutriai.recipe_captures rows: page_generation_failed / Not enough credits"
      - "Nosh ledger: two grants, three spends, one refund; net balance zero"
      - "OpenRouter /api/v1/credits: approximately $4.48 remaining"
      - "supabase/functions/generate-page-art/index.ts"
      - "nutriai.reserve_generation_credit"
    status: resolved
    children:
      - id: N07
        type: question
        title: "Choose the developer credit policy"
        provenance: ai-suggested
        timestamp: "2026-08-23T05:01+03:00"
        description: >-
          Decide whether to grant the developer account test credits, bypass the Nosh ledger
          in development builds, or retain the gate and implement a real replenishment path.
        status: resolved
        children:
          - id: N08
            type: decision
            title: "Suspend internal generation-credit enforcement"
            provenance: user
            timestamp: "2026-08-23T05:18+03:00"
            choice: >-
              Remove the internal credit gate from active page generation during product
              development, preserve the historical ledger as dormant infrastructure, and
              defer a production entitlement model until the product policy is designed.
            alternatives:
              - "Grant the developer account an arbitrary test balance"
              - "Keep enforcing the old ledger and add replenishment now"
              - "Delete the ledger and all historical credit data"
            evidence:
              - N06
              - "User direction: make generation proceed now and redesign credits later for production"
              - "docs/adr/0003-suspend-internal-generation-credits.md"
            status: resolved
          - id: N09
            type: experiment
            title: "Verify credit-free generation completion"
            provenance: ai-executed
            timestamp: "2026-08-23T05:18+03:00"
            result: >-
              A rollback-only live database proof completed a request without a ledger spend,
              selected its page version, and stored credit_cost 0. The focused regression,
              TypeScript, and lint passed; generate-page-art and nosh-chat deployed active as
              version 7. The full Jest run passed 182 of 183 tests, with one unrelated stale
              AddPageScreen mock failure.
            evidence:
              - "supabase/migrations/20260823020628_suspend_internal_generation_credits.sql"
              - "supabase/tests/art_candidate_selection.sql"
              - "__tests__/utils/cookbook/artCandidateSafety.test.ts"
              - "Supabase generate-page-art version 7: ACTIVE"
              - "Supabase nosh-chat version 7: ACTIVE"
            status: resolved
  - id: N10
    type: decision
    title: "Reframe Book Explorer as one-book customization"
    provenance: user
    timestamp: "2026-08-23T05:37+03:00"
    choice: >-
      Replace the catalog-like choice among multiple apparent book products with one
      cookbook under creation whose title, cover treatment, and recipe-page identity
      are personalized before it is added to the shelf.
    alternatives:
      - "Keep the binding shelf as a product-style browser"
      - "Expand the existing template grid into a full design editor"
      - "Keep cover choice coupled to a fixed recipe-page style"
    evidence:
      - "User direction: one customizable Nosh book should remain the visual focus"
      - "User examples: Healthy Meals and Desserts receive distinct identities through customization"
    status: resolved
    children:
      - id: N11
        type: experiment
        title: "Audit Book Explorer UI and style coupling"
        provenance: ai-executed
        timestamp: "2026-08-23T05:37+03:00"
        result: >-
          Phone-sized visual inspection confirmed a two-mode catalog flow labeled Choose a
          binding and All bindings, with preset names presented as book titles. Code tracing
          showed cover_style drives both PhysicalBook binding and the Edge Function's page
          style profile; the persisted page-template default is bypassed by adaptive recipe
          layout selection in the active capture pipeline.
        evidence:
          - "components/create/CreationStudio.tsx"
          - "constants/cookbookStyles.ts"
          - "utils/cookbook/api.ts"
          - "supabase/functions/capture-recipe/index.ts"
          - "supabase/functions/generate-page-art/index.ts"
          - "supabase/functions/_shared/artGeneration.ts"
          - "supabase/functions/_shared/recipeLayout.ts"
          - "Phone-sized Book Explorer screenshots inspected at 390x844"
        status: resolved
      - id: N12
        type: decision
        title: "Prototype the customization studio before production implementation"
        provenance: user
        timestamp: "2026-08-23T05:57+03:00"
        choice: >-
          Build a throwaway, interactive comparison of three one-book customization
          flows before replacing the production Book Explorer.
        alternatives:
          - "Implement the previously recommended studio directly"
          - "Keep the current binding catalog"
          - "Expand immediately into an advanced cover and page designer"
        evidence:
          - N10
          - N11
          - "User affirmation: I like it; create the prototype, then proceed to full implementation"
        status: resolved
        children:
          - id: N13
            type: experiment
            title: "Verify three cookbook customization variants"
            provenance: ai-executed
            timestamp: "2026-08-23T05:57+03:00"
            result: >-
              Three development-only variants ran on the existing Book Explorer route:
              a continuous studio, a tactile customization tray, and guided steps. Phone
              and desktop inspection confirmed live title, cover, inside-page style, URL
              switching, and non-saving completion states. TypeScript, targeted lint, and
              diff checks passed; the current explorer remained available via variant=current.
            evidence:
              - "components/create/BookCreationPrototype.tsx"
              - "app/(book)/library.tsx"
              - "Browser verification at 390x844 and 1280x900"
              - "npm run typecheck"
              - "targeted ESLint and git diff checks"
            status: resolved
          - id: N14
            type: decision
            title: "Adopt the continuous Studio A as production book creation"
            provenance: user
            timestamp: "2026-08-23T07:27+03:00"
            choice: >-
              Replace the production Book Explorer with Studio A, keep cover finishes and
              recipe-page styles catalog-backed, show three curated page languages with
              generated brownie and cookie samples, and defer expanded pickers and cover
              stickers to later work.
            alternatives:
              - "Adopt the tactile tray prototype"
              - "Adopt the guided three-step prototype"
              - "Expose every future style and sticker control in the initial Studio"
            evidence:
              - N13
              - "User verdict: single Studio prototype A is the preferred direction"
              - "User requirement: keep future cover finishes, recipe styles, and stickers extensible"
            status: resolved
            children:
              - id: N15
                type: experiment
                title: "Implement and verify production Studio A"
                provenance: ai-executed
                timestamp: "2026-08-23T07:27+03:00"
                result: >-
                  Generated six distinct brownie/cookie preview pages for Illustrated,
                  Editorial, and Heritage; replaced the prototype with one live production
                  Studio; separated cover_style from page_style_id in client, database, and
                  generation functions; preserved all four live books; and deployed
                  capture-recipe version 4 and generate-page-art version 8. Phone-sized visual
                  checks passed for all spreads and live title/cover changes. TypeScript, lint,
                  50 Jest suites, and 192 tests passed.
                evidence:
                  - "components/create/CreationStudio.tsx"
                  - "constants/cookbookCustomization.ts"
                  - "assets/cookbook/style-previews/"
                  - "supabase/migrations/20260823041346_add_cookbook_page_styles.sql"
                  - "supabase/functions/_shared/artGeneration.ts"
                  - "Browser verification at 390x844"
                  - "Supabase capture-recipe version 4 and generate-page-art version 8: ACTIVE"
                status: resolved
  - id: N16
    type: question
    title: "Choose Nosh's first-run onboarding model"
    provenance: user
    timestamp: "2026-08-25T01:21+03:00"
    description: >-
      Determine whether Nosh should use a guided multi-screen flow, an interactive
      first-book experience, lightweight progressive onboarding, or a hybrid that
      reaches a finished personal recipe page without obscuring the book-first product.
    status: resolved
    children:
      - id: N17
        type: decision
        title: "Adopt the hybrid interactive first-book onboarding"
        provenance: user
        timestamp: "2026-08-25T02:05+03:00"
        choice: >-
          Begin with one skippable, book-first welcome; use the real creation studio
          with compact matched looks; keep the sample explicitly read-only; then open
          the user's real empty book with one first-recipe capture action.
        alternatives:
          - "Use a guided multi-screen feature tour before the shelf"
          - "Start immediately on an empty shelf with only contextual hints"
          - "Insert sample recipes into the user's first personal cookbook"
        evidence:
          - N16
          - O07
          - O09
          - O10
          - "User direction: proceed with the first sequence"
        status: resolved
        children:
          - id: N18
            type: experiment
            title: "Implement and verify the first-run sequence"
            provenance: ai-executed
            timestamp: "2026-08-25T02:05+03:00"
            result: >-
              Added user-scoped versioned first-run state, a skippable welcome, three
              matched first-book looks with progressive detail controls, an explicit
              read-only sample route, and a focused empty-book capture action. All 52
              Jest suites and 200 tests passed with strict TypeScript and lint; the iOS
              bundle returned HTTP 200 and relaunched on iPhone 17 Pro. Authenticated
              visual walkthrough remains pending because the simulator is signed out.
            evidence:
              - "components/onboarding/FirstRunWelcome.tsx"
              - "utils/cookbook/firstRunOnboarding.ts"
              - "components/create/CreationStudio.tsx"
              - "components/cookbook/BookReader.tsx"
              - "npm test -- --runInBand: 52 suites, 200 tests passed"
              - "npm run typecheck"
              - "npm run lint"
              - "iOS Metro bundle: HTTP 200, 19,555,756 bytes"
            status: resolved
