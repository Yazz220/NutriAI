    timestamp: "2026-08-30T00:00+03:00"
    provenance: ai-suggested
    content: >-
      Drive native simulator flows through AXe accessibility identifiers or labels,
      re-read the accessibility tree after every state-changing action, and reserve
      batch automation for stable mechanical sequences.
    context: >-
      Official Codex guidance and local AXe capabilities both emphasize accessibility
      selectors over guessed coordinates while dynamic AI capture screens require fresh
      state inspection.
    potential_type: heuristic
