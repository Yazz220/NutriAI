  - id: O15
    timestamp: "2026-08-25T03:53+03:00"
    provenance: ai-suggested
    content: >-
      Retry a durable multi-stage workflow from its latest valid persisted artifact rather
      than repeating successful expensive stages; a saved RecipeGraph should resume page
      creation and art generation without another extraction call.
    context: >-
      Retrying a page-constraint failure repeated extraction and hit an unrelated model
      truncation even though the first attempt had already persisted Quick Tomato Toast.
    potential_type: heuristic
    bound_to: [N28]
    promoted: true
    promoted_to: "logic/solution/heuristics.md:H08"
    crystallized_via: artifact-commitment
