  - id: O02
    timestamp: "2026-08-23T05:01+03:00"
    provenance: ai-suggested
    content: >-
      Nosh generation credits are an independent application ledger and can block page
      generation even when the configured OpenRouter account has provider credit.
    context: >-
      Repeated image and URL captures extracted successfully but failed at the internal
      reserve_generation_credit call before OpenRouter image generation.
    potential_type: constraint
