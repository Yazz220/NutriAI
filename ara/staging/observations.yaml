  - id: O13
    timestamp: "2026-08-25T03:53+03:00"
    provenance: ai-suggested
    content: >-
      Treat accessibility modals as two-sided boundaries: mark the overlay modal and
      explicitly hide its sibling app subtree from assistive technology for the full
      time the overlay is visible.
    context: >-
      AXe showed shelf and reader controls behind the welcome and Nosh sheet even after
      accessibilityViewIsModal was applied; hiding the sibling subtree removed them.
    potential_type: heuristic
    bound_to: [N26, N27]
    promoted: true
    promoted_to: "logic/solution/heuristics.md:H06"
    crystallized_via: artifact-commitment
