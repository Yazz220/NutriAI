  - id: O14
    timestamp: "2026-08-25T03:53+03:00"
    provenance: ai-suggested
    content: >-
      In fixed physical-book geometry, keep decorative stamped typography at the authored
      scale and provide accessible semantics separately; bound but do not disable scaling
      for interactive copy, prompts, and toolbars that must reflow inside fixed surfaces.
    context: >-
      Accessibility XXL caused cover, bookplate, empty-reader, shelf, and composer
      collisions until decorative and interactive typography were handled separately.
    potential_type: heuristic
    bound_to: [N26]
    promoted: true
    promoted_to: "logic/solution/heuristics.md:H07"
    crystallized_via: artifact-commitment
