  - id: O18
    timestamp: "2026-08-30T00:00+03:00"
    provenance: ai-suggested
    content: >-
      Use a stable source corpus and separate source truth from app output: exercise the
      same recipe as URL, pasted text, screenshot, and supported video link where possible,
      record expected facts before import, and evaluate extraction, page text, and chat
      answers against those facts.
    context: >-
      The testing goal is reliability and semantic correctness across messy user inputs,
      not visual polish or whether the chat sheet merely opens.
    potential_type: heuristic
    bound_to: [N32, N33]
