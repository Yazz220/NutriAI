  - id: O17
    timestamp: "2026-08-30T00:00+03:00"
    provenance: ai-suggested
    content: >-
      Treat the simulator and a physical iPhone as separate QA lanes: the simulator can
      cover in-app URL, text, image, video-link, generation, reader, and chat flows, while
      native share-extension behavior and final device coverage require a physical device.
    context: >-
      Nosh documents audio as unimplemented and native sharing as a physical-device gate;
      this Mac currently has no device visible through the mobile connector.
    potential_type: constraint
    bound_to: [N32, N33]
