    provenance: ai-suggested
    content: >-
      Do not stack progressive onboarding prompts in one visit. Finish the first-page
      introduction first, then reveal a small contextual Nosh callout on a later book
      visit with permanent dismissal and a direct path into the real recipe conversation.
    context: >-
      The approved onboarding had reached first-page activation; Nosh remained the most
      important deferred capability to introduce without turning the flow into a tour.
    potential_type: heuristic
    bound_to: [N21, N22]
